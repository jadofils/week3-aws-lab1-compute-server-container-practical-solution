# Tests the order application and publishes the runnable JAR as a GitHub Release.
#
# EC2 servers download the latest release at launch (user data in infrastructure/template.yaml)
# through the Regional NAT Gateway. No AWS credentials are stored in GitHub: the repository
# is public and the release asset is read over HTTPS.
#
# To publish a new version, change <version> in app/pom.xml and merge to main.
name: Test and release order app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/release-app.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build the JAR
        run: mvn -B verify

      - name: Read application version
        id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: onward-orders-jar
          path: app/target/onward-orders.jar

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: onward-orders-jar

      # Releases are immutable: a version is published once. Bump the version to release again.
      - name: Create release if this version is new
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in app/pom.xml to publish a new one."
          else
            gh release create "$TAG" onward-orders.jar \
              --title "Order app $TAG" \
              --notes "Built from ${GITHUB_SHA}. Servers download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/onward-orders.jar"
          fi

spring.application.name=onward-orders
server.port=${PORT:8080}
server.error.include-message=always

# Display metadata returned by GET /api/info
app.info.student-name=Jado Fils SEZIKEYE
app.info.lab-name=Lab 1 - Handling Sales Day Demand
app.info.application-name=Onward Logistics Order System

# Order rules
app.orders.max-recent-orders=50
app.orders.min-quantity=1
app.orders.max-quantity=100

# Which server answered: read from EC2 instance metadata (IMDSv2); falls back to the host name off EC2.
app.identity.ec2-metadata-enabled=true
app.identity.metadata-timeout=500ms

# Sales-day CPU spike demo (bounded so it is safe to expose through the UI).
app.load.enabled=${LOAD_DEMO_ENABLED:true}
app.load.min-seconds=30
app.load.max-seconds=600

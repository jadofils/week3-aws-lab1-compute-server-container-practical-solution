# Move this file to .github/workflows/build-and-push-ecr.yml in the application repository.
# Configure repository variables AWS_GITHUB_ACTIONS_ROLE_ARN, AWS_REGION, and ECR_REPOSITORY.
# The OIDC role trust policy must restrict the sub claim to this exact repository and main branch.
name: Build and publish application image

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/build-and-push-ecr.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-image:
    name: Build and push to Amazon ECR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate Docker to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image and publish commit and release tags
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --file Dockerfile --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:release"
          docker push "$REGISTRY/$REPOSITORY:release"

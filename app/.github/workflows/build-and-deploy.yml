# Builds, tests and publishes the order application, then hands the release to AWS.
#
# Flow: push to main -> test -> upload deployment bundle (taskdef + appspec) to S3
#       -> push image to ECR -> ECR push event -> EventBridge -> CodePipeline -> CodeDeploy blue/green.
#
# Authentication uses GitHub OIDC: no AWS access keys are stored anywhere.
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION                    e.g. eu-west-1
#   AWS_GITHUB_ACTIONS_ROLE_ARN   output GitHubActionsRoleArn of the 2-security-and-iam stack
#   ENVIRONMENT                   dev | test | prod (defaults to dev)
name: Build and deploy order application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B verify

  publish:
    name: Publish release to AWS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve account-specific names
        id: names
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "repository=onward-${ENVIRONMENT}-orders" >> "$GITHUB_OUTPUT"
          echo "bucket=onward-${ENVIRONMENT}-orders-pipeline-${ACCOUNT_ID}-${AWS_REGION}" >> "$GITHUB_OUTPUT"

      - name: Render task definition and package deployment bundle
        run: |
          # Only substitute our own tokens; leave <IMAGE1_NAME> for CodePipeline.
          envsubst '${AWS_ACCOUNT_ID} ${AWS_REGION} ${ENVIRONMENT}' < taskdef.json > bundle-taskdef.json
          mkdir -p bundle
          mv bundle-taskdef.json bundle/taskdef.json
          cp appspec.yaml bundle/appspec.yaml
          (cd bundle && zip -q ../orders-deploy.zip taskdef.json appspec.yaml)

      # Upload the bundle BEFORE pushing the image so the pipeline always reads the matching descriptors.
      - name: Upload deployment bundle to S3
        run: |
          aws s3 cp orders-deploy.zip "s3://${{ steps.names.outputs.bucket }}/deploy/orders-deploy.zip" \
            --metadata "git-sha=${GITHUB_SHA}"

      - name: Authenticate Docker to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (commit tag, then release tag)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ steps.names.outputs.repository }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          # Pushing the release tag is the event EventBridge listens for.
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:release"
          docker push "$IMAGE:release"

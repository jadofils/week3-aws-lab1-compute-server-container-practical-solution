# CloudFormation template format version.
AWSTemplateFormatVersion: '2010-09-09'

# Explain the purpose of this small bootstrap stack.
Description: >
  Creates the private S3 artifact bucket used by the Lab 1 nested templates
  and application package.

# Shared settings supplied when this bootstrap stack is deployed.
Parameters:
  Project:
    Type: String
    Default: onward
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,11}$'
    Description: Short lowercase project name used in the bucket name and tags.

  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
    Description: Person responsible for this project.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment for this deployment.

# Resources created and managed by this stack.
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Include account and Region to make the globally unique bucket name predictable.
      BucketName: !Sub '${Project}-${Environment}-lab1-artifacts-${AWS::AccountId}-${AWS::Region}'

      # Prevent public ACLs and public bucket policies.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      # Encrypt stored objects with S3-managed keys.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      # Apply the client's required tags to this bucket.
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-lab1-artifacts'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      # Attach this policy to the bucket created above.
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Refuse requests that do not use HTTPS.
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

# Return identifiers that later stacks and publishing scripts will need.
Outputs:
  ArtifactBucketName:
    Description: Bucket name for the template and application artifact publisher.
    Value: !Ref ArtifactBucket

  ArtifactBucketArn:
    Description: Bucket ARN for permissions and stack configuration.
    Value: !GetAtt ArtifactBucket.Arn
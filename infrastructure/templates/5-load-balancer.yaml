AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics orders - the single public entry point. An internet-facing ALB in
  two public subnets with a production listener and a test listener, and two IP
  target groups (blue and green) that CodeDeploy swaps between during releases.

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ApplicationPort:
    Type: Number
    Default: 8080
  ProdListenerPort:
    Type: Number
    Default: 80
  TestListenerPort:
    Type: Number
    Default: 9000
  HealthCheckPath:
    Type: String
    Default: /health

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split [',', { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-PublicSubnetIds' }]
      SecurityGroups:
        - { 'Fn::ImportValue': !Sub '${Project}-${Environment}-security-LoadBalancerSecurityGroupId' }
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: idle_timeout.timeout_seconds, Value: '60' }
      Tags:
        - { Key: Name, Value: !Sub '${Project}-${Environment}-orders-alb' }
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-blue'
      VpcId: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-VpcId' }
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ApplicationPort
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-green'
      VpcId: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-VpcId' }
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ApplicationPort
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # Customer traffic. CodeDeploy re-points this listener to the new target group.
  # HTTP for the lab demo; add an HTTPS listener with an ACM certificate for a real domain.
  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref ProdListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # Engineers can check the replacement (green) tasks here before traffic shifts.
  # Closed to the internet unless TestTrafficCidr is set in 2-security-and-iam.
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref TestListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

Outputs:
  ApplicationUrl:
    Description: The one public address for the order application.
    Value: !Sub 'http://${LoadBalancer.DNSName}'
    Export: { Name: !Sub '${Project}-${Environment}-alb-ApplicationUrl' }
  LoadBalancerFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export: { Name: !Sub '${Project}-${Environment}-alb-LoadBalancerFullName' }
  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup
    Export: { Name: !Sub '${Project}-${Environment}-alb-BlueTargetGroupArn' }
  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export: { Name: !Sub '${Project}-${Environment}-alb-BlueTargetGroupName' }
  BlueTargetGroupFullName:
    Value: !GetAtt BlueTargetGroup.TargetGroupFullName
    Export: { Name: !Sub '${Project}-${Environment}-alb-BlueTargetGroupFullName' }
  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export: { Name: !Sub '${Project}-${Environment}-alb-GreenTargetGroupName' }
  GreenTargetGroupFullName:
    Value: !GetAtt GreenTargetGroup.TargetGroupFullName
    Export: { Name: !Sub '${Project}-${Environment}-alb-GreenTargetGroupFullName' }
  ProdListenerArn:
    Value: !Ref ProdListener
    Export: { Name: !Sub '${Project}-${Environment}-alb-ProdListenerArn' }
  TestListenerArn:
    Value: !Ref TestListener
    Export: { Name: !Sub '${Project}-${Environment}-alb-TestListenerArn' }

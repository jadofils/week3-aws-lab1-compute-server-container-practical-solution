AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics orders - image registry and delivery artifacts. The ECR repository
  receives images from GitHub Actions; the S3 bucket holds the deployment bundle
  (taskdef.json + appspec.yaml) and CodePipeline artifacts.

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ImagesToKeep:
    Type: Number
    Default: 15
    Description: Older images are expired to control storage cost; keep enough for rollback.

Resources:
  OrdersRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-${Environment}-orders'
      # MUTABLE because the moving "release" tag is what triggers the pipeline.
      # Each image is also pushed with an immutable commit-SHA tag for traceability.
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Lets the stack be deleted (idle environments) without manual image cleanup.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the most recent ${ImagesToKeep} images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": ${ImagesToKeep} },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  PipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-orders-pipeline-${AWS::AccountId}-${AWS::Region}'
      # CodePipeline's S3 source action requires versioning.
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Old versions of the bundle and pipeline artifacts are removed after 30 days.
          # Current versions are kept so the pipeline always finds the latest bundle.
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - { Key: Name, Value: !Sub '${Project}-${Environment}-orders-pipeline' }
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  PipelineBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PipelineBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PipelineBucket.Arn
              - !Sub '${PipelineBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  RepositoryName:
    Value: !Ref OrdersRepository
    Export: { Name: !Sub '${Project}-${Environment}-registry-RepositoryName' }
  RepositoryUri:
    Value: !GetAtt OrdersRepository.RepositoryUri
    Export: { Name: !Sub '${Project}-${Environment}-registry-RepositoryUri' }
  PipelineBucketName:
    Value: !Ref PipelineBucket
    Export: { Name: !Sub '${Project}-${Environment}-registry-PipelineBucketName' }

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics orders - security groups and IAM roles. Every permission is a
  role with an AWS managed policy or a standalone customer managed policy
  (AWS::IAM::ManagedPolicy). There are no inline policies. GitHub Actions gets
  short-lived credentials through OIDC; no access keys exist.

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ApplicationPort:
    Type: Number
    Default: 8080
  ProdListenerPort:
    Type: Number
    Default: 80
  TestListenerPort:
    Type: Number
    Default: 9000
  TestTrafficCidr:
    Type: String
    Default: ''
    Description: >
      Optional CIDR (for example your own IP/32) allowed to reach the blue/green test
      listener. Leave empty to keep the test listener closed to the internet.
  GitHubOwner:
    Type: String
    Default: jadofils
    Description: GitHub user or organisation that owns the application repository.
  GitHubAppRepository:
    Type: String
    Default: onward-orders-app
    Description: Name of the application repository allowed to assume the deploy role.
  GitHubBranch:
    Type: String
    Default: main
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider.

Conditions:
  HasTestTrafficCidr: !Not [!Equals [!Ref TestTrafficCidr, '']]
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # ---------------------------------------------------------------- Security groups
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Project}-${Environment}-orders-alb-sg'
      GroupDescription: Public HTTP to the load balancer; ALB may only call app targets.
      VpcId: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-VpcId' }
      SecurityGroupIngress:
        - Description: Customers reach the single public entry point.
          IpProtocol: tcp
          FromPort: !Ref ProdListenerPort
          ToPort: !Ref ProdListenerPort
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Forward to application tasks inside the VPC only.
          IpProtocol: tcp
          FromPort: !Ref ApplicationPort
          ToPort: !Ref ApplicationPort
          CidrIp: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-VpcCidr' }
      Tags:
        - { Key: Name, Value: !Sub '${Project}-${Environment}-orders-alb-sg' }
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  TestListenerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasTestTrafficCidr
    Properties:
      GroupId: !Ref LoadBalancerSecurityGroup
      Description: Engineers may preview the green release on the test listener.
      IpProtocol: tcp
      FromPort: !Ref TestListenerPort
      ToPort: !Ref TestListenerPort
      CidrIp: !Ref TestTrafficCidr

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Project}-${Environment}-orders-app-sg'
      GroupDescription: Order tasks accept traffic only from the load balancer.
      VpcId: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-VpcId' }
      SecurityGroupIngress:
        - Description: Application traffic from the load balancer only.
          IpProtocol: tcp
          FromPort: !Ref ApplicationPort
          ToPort: !Ref ApplicationPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        # HTTPS only. The private route table has no internet route, so this can only
        # reach the VPC interface endpoints and the S3 gateway endpoint (whose
        # Region-specific prefix list cannot be referenced portably in CloudFormation).
        - Description: HTTPS to AWS services through VPC endpoints only (no internet route).
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: !Sub '${Project}-${Environment}-orders-app-sg' }
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Project}-${Environment}-orders-endpoints-sg'
      GroupDescription: Interface endpoints accept HTTPS from application tasks only.
      VpcId: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-VpcId' }
      SecurityGroupIngress:
        - Description: HTTPS from order tasks.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      SecurityGroupEgress:
        - Description: Responses stay inside the VPC.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-VpcCidr' }
      Tags:
        - { Key: Name, Value: !Sub '${Project}-${Environment}-orders-endpoints-sg' }
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- ECS task roles
  # Used by ECS to pull the image from ECR and write logs.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # Identity of the application itself. It calls no AWS APIs, so it has no permissions.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- Delivery roles
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-codedeploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS'
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  CodePipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-codepipeline-policy'
      Description: Least-privilege permissions for the order delivery pipeline.
      Roles: [!Ref CodePipelineRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PipelineArtifacts
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${Project}-${Environment}-orders-pipeline-${AWS::AccountId}-${AWS::Region}/*'
          - Sid: PipelineArtifactBucket
            Effect: Allow
            Action: [s3:GetBucketVersioning, s3:GetBucketLocation, s3:ListBucket]
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${Project}-${Environment}-orders-pipeline-${AWS::AccountId}-${AWS::Region}'
          - Sid: ReadReleaseImage
            Effect: Allow
            Action: [ecr:DescribeImages]
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-${Environment}-orders'
          - Sid: StartBlueGreenDeployment
            Effect: Allow
            Action:
              - codedeploy:CreateDeployment
              - codedeploy:GetDeployment
              - codedeploy:GetApplication
              - codedeploy:GetApplicationRevision
              - codedeploy:RegisterApplicationRevision
            Resource:
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${Project}-${Environment}-orders'
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${Project}-${Environment}-orders/*'
          - Sid: ReadDeploymentConfig
            Effect: Allow
            Action: [codedeploy:GetDeploymentConfig]
            Resource: !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'
          - Sid: RegisterTaskDefinition
            Effect: Allow
            # These ECS actions do not support resource-level permissions.
            Action: [ecs:RegisterTaskDefinition, ecs:TagResource]
            Resource: '*'
          - Sid: PassTaskRolesToEcs
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !GetAtt TaskExecutionRole.Arn
              - !GetAtt TaskRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  # EventBridge assumes this role to start the pipeline when a release image is pushed.
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-eventbridge-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  EventBridgeStartPipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-start-pipeline-policy'
      Description: Allow EventBridge to start only the order delivery pipeline.
      Roles: [!Ref EventBridgeRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: codepipeline:StartPipelineExecution
            Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Project}-${Environment}-orders-pipeline'

  # ---------------------------------------------------------------- GitHub OIDC
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # Only workflows on the application repository's main branch can assume this role.
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-github-actions-role'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubAppRepository}:ref:refs/heads/${GitHubBranch}'
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  GitHubActionsPublishPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-github-publish-policy'
      Description: Push the order image to ECR and upload the deployment bundle. Nothing else.
      Roles: [!Ref GitHubActionsRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: PushOrderImage
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:CompleteLayerUpload
              - ecr:InitiateLayerUpload
              - ecr:PutImage
              - ecr:UploadLayerPart
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-${Environment}-orders'
          - Sid: UploadDeploymentBundle
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${Project}-${Environment}-orders-pipeline-${AWS::AccountId}-${AWS::Region}/deploy/*'

Outputs:
  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroup
    Export: { Name: !Sub '${Project}-${Environment}-security-LoadBalancerSecurityGroupId' }
  ApplicationSecurityGroupId:
    Value: !Ref ApplicationSecurityGroup
    Export: { Name: !Sub '${Project}-${Environment}-security-ApplicationSecurityGroupId' }
  EndpointSecurityGroupId:
    Value: !Ref EndpointSecurityGroup
    Export: { Name: !Sub '${Project}-${Environment}-security-EndpointSecurityGroupId' }
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export: { Name: !Sub '${Project}-${Environment}-security-TaskExecutionRoleArn' }
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export: { Name: !Sub '${Project}-${Environment}-security-TaskRoleArn' }
  CodeDeployRoleArn:
    Value: !GetAtt CodeDeployRole.Arn
    Export: { Name: !Sub '${Project}-${Environment}-security-CodeDeployRoleArn' }
  CodePipelineRoleArn:
    Value: !GetAtt CodePipelineRole.Arn
    Export: { Name: !Sub '${Project}-${Environment}-security-CodePipelineRoleArn' }
  EventBridgeRoleArn:
    Value: !GetAtt EventBridgeRole.Arn
    Export: { Name: !Sub '${Project}-${Environment}-security-EventBridgeRoleArn' }
  GitHubActionsRoleArn:
    Description: Set this as the AWS_GITHUB_ACTIONS_ROLE_ARN variable in the application repository.
    Value: !GetAtt GitHubActionsRole.Arn

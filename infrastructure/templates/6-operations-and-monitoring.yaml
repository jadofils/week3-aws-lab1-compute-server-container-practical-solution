AWSTemplateFormatVersion: '2010-09-09'
Description: Operations and monitoring for the Onward Logistics application

# These values identify the resources created by the load-balancer and compute stacks.
Parameters:
  Project:
    Type: String

  Environment:
    Type: String

  LoadBalancerFullName:
    Type: String
    Description: Full load balancer name used as the CloudWatch metric dimension

  TargetGroupFullName:
    Type: String
    Description: Full target group name used as the CloudWatch metric dimension

  AlarmEvaluationPeriods:
    Type: Number
    Default: 2

  AlarmPeriodSeconds:
    Type: Number
    Default: 300

Resources:
  # This alarm detects when one or more application instances are unhealthy
  # in the target group behind the load balancer.
  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${Project}-${Environment}: one or more application targets are unhealthy"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
      Statistic: Maximum
      Period: !Ref AlarmPeriodSeconds
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # This alarm detects 5xx responses generated by the load balancer itself.
  # Target-generated 5xx responses use a separate HTTPCode_Target_5XX_Count metric.
  LoadBalancer5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${Project}-${Environment}: the load balancer generated HTTP 5xx errors"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Sum
      Period: !Ref AlarmPeriodSeconds
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  # These outputs let the root stack show which monitoring alarms were created.
  UnhealthyTargetsAlarmName:
    Description: CloudWatch alarm for unhealthy targets
    Value: !Ref UnhealthyTargetsAlarm

  LoadBalancer5xxAlarmName:
    Description: CloudWatch alarm for load-balancer-generated 5xx responses
    Value: !Ref LoadBalancer5xxAlarm
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics orders - ECS on Fargate. Tasks run in private subnets across two
  Availability Zones with no public IP. The service uses the CODE_DEPLOY deployment
  controller so releases are blue/green, and target tracking scales task count.
  Deploy this stack only after the first image with the "release" tag is in ECR.

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ApplicationPort:
    Type: Number
    Default: 8080
  TaskCpu:
    Type: String
    Default: '512'
    Description: 0.5 vCPU. Must match taskdef.json in the application repository.
  TaskMemory:
    Type: String
    Default: '1024'
    Description: 1 GB. Must match taskdef.json in the application repository.
  DesiredCount:
    Type: Number
    Default: 2
  MinCapacity:
    Type: Number
    Default: 2
    Description: Two tasks keep one running in each AZ if a task or a zone fails.
  MaxCapacity:
    Type: Number
    Default: 6
    Description: Upper bound that caps peak-day spend (3x normal demand).
  CpuTargetPercent:
    Type: Number
    Default: 50
  EnableOffHoursScaleDown:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: When true, scales to 0 tasks 19:00-07:00 UTC on weekdays and over weekends.
  LogRetentionDays:
    Type: Number
    Default: 14

Conditions:
  OffHoursScaleDown: !Equals [!Ref EnableOffHoursScaleDown, 'true']

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Project}-${Environment}-orders-cluster'
      CapacityProviders: [FARGATE]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${Project}-${Environment}-orders'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # Initial revision only. After the first deployment, new revisions come from
  # taskdef.json in the application repository via CodePipeline/CodeDeploy.
  # Do not change this resource after creation: CloudFormation cannot update the
  # task definition of a service that uses the CODE_DEPLOY controller.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-${Environment}-orders'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-security-TaskExecutionRoleArn' }
      TaskRoleArn: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-security-TaskRoleArn' }
      ContainerDefinitions:
        - Name: onward-orders
          Image: !Sub
            - '${RepositoryUri}:release'
            - RepositoryUri: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-registry-RepositoryUri' }
          Essential: true
          PortMappings:
            - { ContainerPort: !Ref ApplicationPort, Protocol: tcp, Name: http }
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: orders
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${Project}-${Environment}-orders-service'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 90
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [',', { 'Fn::ImportValue': !Sub '${Project}-${Environment}-network-PrivateSubnetIds' }]
          SecurityGroups:
            - { 'Fn::ImportValue': !Sub '${Project}-${Environment}-security-ApplicationSecurityGroupId' }
      LoadBalancers:
        - ContainerName: onward-orders
          ContainerPort: !Ref ApplicationPort
          TargetGroupArn: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-BlueTargetGroupArn' }
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # Uses the Application Auto Scaling service-linked role (no custom role needed).
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity
      ScheduledActions: !If
        - OffHoursScaleDown
        - - ScheduledActionName: !Sub '${Project}-${Environment}-orders-evening-scale-down'
            Schedule: 'cron(0 19 ? * MON-FRI *)'
            ScalableTargetAction: { MinCapacity: 0, MaxCapacity: 0 }
          - ScheduledActionName: !Sub '${Project}-${Environment}-orders-morning-scale-up'
            Schedule: 'cron(0 7 ? * MON-FRI *)'
            ScalableTargetAction: { MinCapacity: !Ref MinCapacity, MaxCapacity: !Ref MaxCapacity }
        - !Ref AWS::NoValue

  # Adds tasks when average CPU rises above the target and removes them when it falls.
  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Project}-${Environment}-orders-cpu-target-tracking'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTargetPercent
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 120

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub '${Project}-${Environment}-ecs-ClusterName' }
  ServiceName:
    Value: !GetAtt Service.Name
    Export: { Name: !Sub '${Project}-${Environment}-ecs-ServiceName' }
  LogGroupName:
    Value: !Ref LogGroup

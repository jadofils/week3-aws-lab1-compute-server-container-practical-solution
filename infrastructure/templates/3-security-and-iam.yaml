AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Security and IAM child stack for the Onward Logistics Lab 1 environment.

Parameters:
  Project:
    Type: String

  Owner:
    Type: String

  Environment:
    Type: String

  VpcId:
    Type: String
    Description: VPC ID received from the network child stack.

  VpcCidr:
    Type: String
    Description: VPC range used to limit load-balancer egress.

  ArtifactBucketArn:
    Type: String
    Description: Artifact bucket ARN received from the bootstrap stack.

  AppArtifactKey:
    Type: String
    Description: Exact S3 object key for the application package.

  PublicListenerPort:
    Type: Number
    Default: 80
    Description: Public HTTP listener port for the demo.

  ApplicationPort:
    Type: Number
    Default: 8080
    Description: Port used by the Spring Boot application.

Resources:
  # Public traffic reaches the load balancer; it can send app traffic into the VPC.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP traffic to the application load balancer.
      GroupName: !Sub 'onward-${Environment}-orders-alb-sg'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Allow HTTP requests from customers.
          IpProtocol: tcp
          FromPort: !Ref PublicListenerPort
          ToPort: !Ref PublicListenerPort
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Allow the load balancer to reach app targets inside the VPC.
          IpProtocol: tcp
          FromPort: !Ref ApplicationPort
          ToPort: !Ref ApplicationPort
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-orders-alb-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # EC2 accepts app traffic only from the load balancer security group.
  # Its outbound access supports updates through the private subnet's NAT route.
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow application traffic only from the load balancer.
      GroupName: !Sub 'onward-${Environment}-orders-app-sg'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Allow Spring Boot traffic from the load balancer.
          IpProtocol: tcp
          FromPort: !Ref ApplicationPort
          ToPort: !Ref ApplicationPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - Description: Allow outbound downloads and AWS service connections.
          IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-orders-app-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # EC2 assumes this role to use Systems Manager and read its app package.
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'onward-${Environment}-orders-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This is a customer-managed policy resource, not an inline role policy.
  # It grants read access to only the named app artifact in the S3 bucket.
  AppArtifactReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'onward-${Environment}-orders-app-artifact-read'
      Description: Allow the EC2 app role to download its specific application package.
      Roles:
        - !Ref EC2InstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadApplicationPackage
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub '${ArtifactBucketArn}/${AppArtifactKey}'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # EC2 uses an instance profile to receive its IAM role at launch.
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'onward-${Environment}-orders-instance-profile'
      Roles:
        - !Ref EC2InstanceRole

Outputs:
  # Share these identifiers with the load-balancer and compute child stacks.
  LoadBalancerSecurityGroupId:
    Description: Security group ID for the public load balancer.
    Value: !Ref LoadBalancerSecurityGroup

  ApplicationSecurityGroupId:
    Description: Security group ID for private app instances.
    Value: !Ref ApplicationSecurityGroup

  EC2InstanceProfileName:
    Description: Instance profile attached to the EC2 launch template.
    Value: !Ref EC2InstanceProfile

  AppArtifactReadPolicyArn:
    Description: Managed policy ARN for reading the app artifact.
    Value: !Ref AppArtifactReadPolicy
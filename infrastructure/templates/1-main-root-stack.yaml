AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Root stack for the Onward Logistics Lab 1 infrastructure.
  It creates the child stacks in dependency order and passes their outputs forward.

Parameters:
  # Shared project identity passed to each child stack for naming and resource tags.
  Project:
    Type: String
    Default: onward
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,11}$'
    Description: Short lowercase project name.

  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
    Description: Person responsible for the resources.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment used in resource names and tags.

  # Child templates and the application artifact are stored in the bootstrap S3 bucket.
  ArtifactBucketName:
    Type: String
    Description: S3 bucket created by the artifact-store bootstrap stack.

  TemplateRevision:
    Type: String
    Description: S3 key prefix containing this revision's child templates.

  AppArtifactKey:
    Type: String
    Description: S3 object key for the packaged Spring Boot application JAR.

  # VPC and subnet address ranges passed to the network stack.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Address range for the VPC.

  PublicSubnetCidrA:
    Type: String
    Default: 10.0.0.0/24
    Description: Public subnet address range in Availability Zone A.

  PublicSubnetCidrB:
    Type: String
    Default: 10.0.1.0/24
    Description: Public subnet address range in Availability Zone B.

  PrivateSubnetCidrA:
    Type: String
    Default: 10.0.10.0/24
    Description: Private subnet address range in Availability Zone A.

  PrivateSubnetCidrB:
    Type: String
    Default: 10.0.11.0/24
    Description: Private subnet address range in Availability Zone B.

  # Initial compute assumptions; finalize these after the AWS Calculator cost discovery.
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the application Auto Scaling group.

  ApplicationPort:
    Type: Number
    Default: 8080
    Description: Port used by the Spring Boot application.

  MinSize:
    Type: Number
    Default: 2
    Description: Minimum number of application instances.

  DesiredCapacity:
    Type: Number
    Default: 2
    Description: Starting number of application instances.

  MaxSize:
    Type: Number
    Default: 4
    Description: Maximum number of application instances.

  CpuTarget:
    Type: Number
    Default: 50
    Description: Average CPU target percentage for target tracking.

Resources:
  # Create the VPC and subnets first; later stacks consume its outputs.
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - 'https://s3.${AWS::Region}.amazonaws.com/${Bucket}/${Revision}/2-network.yaml'
        - Bucket: !Ref ArtifactBucketName
          Revision: !Ref TemplateRevision
      Parameters:
        Project: !Ref Project
        Owner: !Ref Owner
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidrA: !Ref PublicSubnetCidrA
        PublicSubnetCidrB: !Ref PublicSubnetCidrB
        PrivateSubnetCidrA: !Ref PrivateSubnetCidrA
        PrivateSubnetCidrB: !Ref PrivateSubnetCidrB
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Create security groups and the EC2 instance role after the VPC exists.
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - 'https://s3.${AWS::Region}.amazonaws.com/${Bucket}/${Revision}/3-security-and-iam.yaml'
        - Bucket: !Ref ArtifactBucketName
          Revision: !Ref TemplateRevision
      Parameters:
        Project: !Ref Project
        Owner: !Ref Owner
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        ApplicationPort: !Ref ApplicationPort
        ArtifactBucketArn: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
        AppArtifactKey: !Ref AppArtifactKey
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Create the public Application Load Balancer using the VPC and load-balancer security group.
  LoadBalancerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - 'https://s3.${AWS::Region}.amazonaws.com/${Bucket}/${Revision}/4-load-balancer.yaml'
        - Bucket: !Ref ArtifactBucketName
          Revision: !Ref TemplateRevision
      Parameters:
        Project: !Ref Project
        Owner: !Ref Owner
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds
        LoadBalancerSecurityGroupId: !GetAtt SecurityStack.Outputs.LoadBalancerSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Launch application instances in private subnets and register them with the load balancer.
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - 'https://s3.${AWS::Region}.amazonaws.com/${Bucket}/${Revision}/5-compute-and-autoscaling.yaml'
        - Bucket: !Ref ArtifactBucketName
          Revision: !Ref TemplateRevision
      Parameters:
        Project: !Ref Project
        Owner: !Ref Owner
        Environment: !Ref Environment
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        ApplicationSecurityGroupId: !GetAtt SecurityStack.Outputs.ApplicationSecurityGroupId
        EC2InstanceProfileName: !GetAtt SecurityStack.Outputs.EC2InstanceProfileName
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.TargetGroupArn
        ArtifactBucketName: !Ref ArtifactBucketName
        AppArtifactKey: !Ref AppArtifactKey
        InstanceType: !Ref InstanceType
        ApplicationPort: !Ref ApplicationPort
        MinSize: !Ref MinSize
        DesiredCapacity: !Ref DesiredCapacity
        MaxSize: !Ref MaxSize
        CpuTarget: !Ref CpuTarget
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Monitor target health and load-balancer-generated server errors.
  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - 'https://s3.${AWS::Region}.amazonaws.com/${Bucket}/${Revision}/6-operations-and-monitoring.yaml'
        - Bucket: !Ref ArtifactBucketName
          Revision: !Ref TemplateRevision
      Parameters:
        Project: !Ref Project
        Environment: !Ref Environment
        LoadBalancerFullName: !GetAtt LoadBalancerStack.Outputs.LoadBalancerFullName
        TargetGroupFullName: !GetAtt LoadBalancerStack.Outputs.TargetGroupFullName
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

Outputs:
  # Expose the application endpoint and useful infrastructure identifiers at the root level.
  ApplicationUrl:
    Description: URL for the application load balancer.
    Value: !GetAtt LoadBalancerStack.Outputs.LoadBalancerUrl

  VpcId:
    Description: VPC ID created by the network stack.
    Value: !GetAtt NetworkStack.Outputs.VpcId

  AutoScalingGroupName:
    Description: Name of the application Auto Scaling group.
    Value: !GetAtt ComputeStack.Outputs.AutoScalingGroupName

  UnhealthyTargetsAlarmName:
    Description: CloudWatch alarm monitoring unhealthy targets.
    Value: !GetAtt MonitoringStack.Outputs.UnhealthyTargetsAlarmName

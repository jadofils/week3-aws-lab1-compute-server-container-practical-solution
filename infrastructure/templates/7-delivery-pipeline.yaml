AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics orders - automated, zero-downtime delivery.
  ECR "release" push -> EventBridge -> CodePipeline -> CodeDeploy ECS blue/green.
  CloudWatch alarms stop a bad release and CodeDeploy rolls traffic back automatically.

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSCanary10Percent5Minutes
    AllowedValues:
      - CodeDeployDefault.ECSAllAtOnce
      - CodeDeployDefault.ECSCanary10Percent5Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
    Description: Canary sends 10% of customers to the new version for 5 minutes before the rest.
  BlueTerminationWaitMinutes:
    Type: Number
    Default: 10
    Description: How long the old (blue) tasks stay available for instant rollback after success.
  ReleaseImageTag:
    Type: String
    Default: release
  DeploymentBundleKey:
    Type: String
    Default: deploy/orders-deploy.zip

Resources:
  # ---------------------------------------------------------------- Rollback alarms
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-${Environment}-orders-target-5xx'
      AlarmDescription: The application returned server errors; CodeDeploy rolls back an in-progress release.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-LoadBalancerFullName' }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  BlueUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-${Environment}-orders-blue-unhealthy'
      AlarmDescription: Tasks in the blue target group are failing health checks.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-LoadBalancerFullName' }
        - Name: TargetGroup
          Value: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-BlueTargetGroupFullName' }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  GreenUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-${Environment}-orders-green-unhealthy'
      AlarmDescription: Tasks in the green target group are failing health checks.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-LoadBalancerFullName' }
        - Name: TargetGroup
          Value: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-GreenTargetGroupFullName' }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- CodeDeploy
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${Project}-${Environment}-orders'
      ComputePlatform: ECS
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${Project}-${Environment}-orders-dg'
      ServiceRoleArn: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-security-CodeDeployRoleArn' }
      DeploymentConfigName: !Ref DeploymentConfigName
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref BlueTerminationWaitMinutes
      ECSServices:
        - ClusterName: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-ecs-ClusterName' }
          ServiceName: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-ecs-ServiceName' }
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-BlueTargetGroupName' }
              - Name: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-GreenTargetGroupName' }
            ProdTrafficRoute:
              ListenerArns:
                - { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-ProdListenerArn' }
            TestTrafficRoute:
              ListenerArns:
                - { 'Fn::ImportValue': !Sub '${Project}-${Environment}-alb-TestListenerArn' }
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM]
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref Target5xxAlarm
          - Name: !Ref BlueUnhealthyAlarm
          - Name: !Ref GreenUnhealthyAlarm
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- CodePipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-pipeline'
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-security-CodePipelineRoleArn' }
      ArtifactStore:
        Type: S3
        Location: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-registry-PipelineBucketName' }
      Stages:
        - Name: Source
          Actions:
            # The release image (imageDetail.json). Triggered by the EventBridge rule below.
            - Name: ReleaseImage
              ActionTypeId: { Category: Source, Owner: AWS, Provider: ECR, Version: '1' }
              Configuration:
                RepositoryName: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-registry-RepositoryName' }
                ImageTag: !Ref ReleaseImageTag
              OutputArtifacts:
                - Name: ImageArtifact
            # taskdef.json + appspec.yaml uploaded by GitHub Actions just before the image push.
            - Name: DeploymentBundle
              ActionTypeId: { Category: Source, Owner: AWS, Provider: S3, Version: '1' }
              Configuration:
                S3Bucket: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-registry-PipelineBucketName' }
                S3ObjectKey: !Ref DeploymentBundleKey
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: BundleArtifact
        - Name: Deploy
          Actions:
            - Name: BlueGreenToEcs
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeployToECS, Version: '1' }
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                TaskDefinitionTemplateArtifact: BundleArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: BundleArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: BundleArtifact
                - Name: ImageArtifact
      Tags:
        - { Key: Project, Value: !Ref Project }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------- EventBridge trigger
  ReleaseImagePushedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-release-pushed'
      Description: Start the order pipeline when a new release image is pushed to ECR.
      State: ENABLED
      EventPattern:
        source: [aws.ecr]
        detail-type: [ECR Image Action]
        detail:
          action-type: [PUSH]
          result: [SUCCESS]
          repository-name:
            - { 'Fn::ImportValue': !Sub '${Project}-${Environment}-registry-RepositoryName' }
          image-tag: [!Ref ReleaseImageTag]
      Targets:
        - Id: OrdersPipeline
          Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: { 'Fn::ImportValue': !Sub '${Project}-${Environment}-security-EventBridgeRoleArn' }

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
  DeploymentGroupName:
    Value: !Ref DeploymentGroup
